<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning HTML - Machine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header></header>

    <div class="container">
        <h1>Interactive Color Machine</h1>
        <p>Click the button below to change the background color of the box.</p>

        <div id="colorBox" style="width: 100%; height: 200px; background-color: #2a2a2a; border: 2px solid #ffffff; margin-top: 20px; display: flex; justify-content: center; align-items: center;">
            <h2 id="colorName" style="color: #ffffff;">Default Color</h2>
        </div>

        <button onclick="changeColor()">Change Color</button>
    </div>

    <script src="nav.js"></script>
    
    <script>
        function changeColor() {
            var red = Math.floor(Math.random() * 256);
            var green = Math.floor(Math.random() * 256);
            var blue = Math.floor(Math.random() * 256);
            
            var randomColor = "rgb(" + red + "," + green + "," + blue + ")";
            
            document.getElementById("colorBox").style.backgroundColor = randomColor;
            
            document.getElementById("colorName").innerText = randomColor;
        }
    </script>
</body>
</html>
