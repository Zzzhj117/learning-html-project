<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning HTML - Quotes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header></header>

    <div class="container">
        <h1>Random Quote Generator</h1>
        <p>Click the button below to display a random quote.</p>

        <div style="background-color: #2a2a2a; padding: 20px; border-left: 5px solid #00d2ff; margin: 20px 0;">
            <p id="quoteText" style="font-size: 18px; font-style: italic;">"Click the button to start."</p>
            <p id="quoteAuthor" style="text-align: right; font-weight: bold;">- Unknown</p>
        </div>

        <button onclick="generateQuote()">Generate Quote</button>
    </div>

    <script src="nav.js"></script>
    
    <script>
        var quotes = [
            "The only way to do great work is to love what you do. - Steve Jobs",
            "Life is what happens when you're busy making other plans. - John Lennon",
            "Get busy living or get busy dying. - Stephen King",
            "You only live once, but if you do it right, once is enough. - Mae West",
            "Many of life’s failures are people who did not realize how close they were to success when they gave up. - Thomas Edison",
            "If you want to live a happy life, tie it to a goal, not to people or things. - Albert Einstein",
            "Never let the fear of striking out keep you from playing the game. - Babe Ruth",
            "Money and success don’t change people; they merely amplify what is already there. - Will Smith",
            "Your time is limited, so don’t waste it living someone else’s life. - Steve Jobs",
            "Not how long, but how well you have lived is the main thing. - Seneca",
            "The whole secret of a successful life is to find out what is one’s destiny to do, and then do it. - Henry Ford",
            "In order to write about life first you must live it. - Ernest Hemingway",
            "The big lesson in life, baby, is never be scared of anyone or anything. - Frank Sinatra",
            "Sing like no one’s listening, love like you’ve never been hurt. - Mark Twain",
            "Do not dwell in the past, do not dream of the future, concentrate the mind on the present moment. - Buddha"
        ];

        function generateQuote() {
            var randomNumber = Math.floor(Math.random() * quotes.length);
            
            var selectedQuote = quotes[randomNumber];
            
            var parts = selectedQuote.split(" - ");
            
            document.getElementById("quoteText").innerText = '"' + parts[0] + '"';
            document.getElementById("quoteAuthor").innerText = "- " + parts[1];
        }
    </script>
</body>
</html>
